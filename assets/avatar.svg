<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 190" width="300" height="380" role="img" aria-label="Chibi portrait of a girl with blue hair and a coral hairpin, under a starry sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1b2450"/>
      <stop offset="0.55" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#2a1c3f"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63e2c6"/>
      <stop offset="0.5" stop-color="#4d6bfe"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <linearGradient id="hair" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6c86f0"/>
      <stop offset="0.6" stop-color="#3f57cc"/>
      <stop offset="1" stop-color="#2b3a9e"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4fbb"/>
      <stop offset="1" stop-color="#232f7a"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd8ff"/>
      <stop offset="0.6" stop-color="#3d7bff"/>
      <stop offset="1" stop-color="#1b2a6e"/>
    </linearGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9aae" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff9aae" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="146" height="186" rx="20" fill="url(#sky)" stroke="url(#frame)" stroke-width="3"/>
  <rect x="9" y="9" width="132" height="172" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <g fill="#dbe6ff">
    <circle cx="24" cy="30" r="1.4" opacity="0.85"/>
    <circle cx="128" cy="26" r="1.1" opacity="0.6"/>
    <circle cx="122" cy="168" r="1" opacity="0.45"/>
    <circle cx="26" cy="160" r="1.1" opacity="0.5"/>
  </g>

  <g fill="#ffc6d6" opacity="0.85">
    <ellipse cx="32" cy="76" rx="4" ry="2.3" transform="rotate(-24 32 76)"/>
    <ellipse cx="120" cy="96" rx="3.4" ry="2" transform="rotate(18 120 96)" opacity="0.7"/>
    <ellipse cx="116" cy="148" rx="3.2" ry="1.9" transform="rotate(28 116 148)" opacity="0.55"/>
  </g>

  <!-- shoulders -->
  <path d="M16 186 C20 154 46 134 75 134 C104 134 130 154 134 186 Z" fill="url(#hoodie)"/>
  <path d="M63 137 C67 147 83 147 87 137" fill="none" stroke="#8fa6ff" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  <path d="M66 144 C70 152 80 152 84 144" fill="none" stroke="#8fa6ff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- neck -->
  <path d="M70 118 h10 v18 h-10 z" fill="#e8bda4"/>

  <!-- hair behind -->
  <path d="M75 34 C46 34 30 54 30 86 C30 112 36 132 44 142 C44 116 48 96 58 84 C50 66 58 52 75 52 C92 52 100 66 92 84 C102 96 106 116 106 142 C114 132 120 112 120 86 C120 54 104 34 75 34 Z" fill="url(#hair)"/>

  <!-- head -->
  <ellipse cx="75" cy="88" rx="33" ry="35" fill="#f7d6bf"/>

  <!-- bangs -->
  <path d="M41 88 C41 58 56 44 75 44 C94 44 109 58 109 88 C104 74 90 67 75 67 C60 67 46 74 41 88 Z" fill="url(#hair)"/>
  <!-- side locks -->
  <path d="M42 82 C38 96 38 110 41 122 C46 110 47 96 46 88 Z" fill="url(#hair)"/>
  <path d="M108 82 C112 96 112 110 109 122 C104 110 103 96 104 88 Z" fill="url(#hair)"/>

  <!-- coral streak -->
  <path d="M95 50 C102 58 106 72 106 88 C104 74 100 62 93 54 Z" fill="#e08a68" opacity="0.85"/>

  <!-- eyes -->
  <g>
    <ellipse cx="61" cy="92" rx="7" ry="8.6" fill="#f2f7ff"/>
    <ellipse cx="89" cy="92" rx="7" ry="8.6" fill="#f2f7ff"/>
    <ellipse cx="61" cy="93" rx="5.4" ry="7" fill="url(#iris)"/>
    <ellipse cx="89" cy="93" rx="5.4" ry="7" fill="url(#iris)"/>
    <ellipse cx="61" cy="93.5" rx="2.4" ry="3.2" fill="#101733"/>
    <ellipse cx="89" cy="93.5" rx="2.4" ry="3.2" fill="#101733"/>
    <circle cx="59" cy="89.5" r="2.4" fill="#ffffff"/>
    <circle cx="87" cy="89.5" r="2.4" fill="#ffffff"/>
    <circle cx="63.5" cy="97" r="1.2" fill="#ffffff" opacity="0.85"/>
    <circle cx="91.5" cy="97" r="1.2" fill="#ffffff" opacity="0.85"/>
    <!-- lashes -->
    <path d="M53.5 86.5 C57 83.4 65 83.4 68.5 86.5" fill="none" stroke="#1b2350" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M81.5 86.5 C85 83.4 93 83.4 96.5 86.5" fill="none" stroke="#1b2350" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- blush -->
  <ellipse cx="49" cy="104" rx="6" ry="3.6" fill="url(#cheek)"/>
  <ellipse cx="101" cy="104" rx="6" ry="3.6" fill="url(#cheek)"/>

  <!-- mouth -->
  <path d="M71 110 q4 4 8 0" fill="none" stroke="#b8604f" stroke-width="1.9" stroke-linecap="round"/>

  <!-- coral asterisk pin -->
  <g stroke="#e08a68" stroke-width="2.4" stroke-linecap="round">
    <line x1="120" y1="58" x2="120" y2="72"/>
    <line x1="113.5" y1="61.5" x2="126.5" y2="68.5"/>
    <line x1="113.5" y1="68.5" x2="126.5" y2="61.5"/>
  </g>
</svg>
